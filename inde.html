<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
    <script src="java.js"></script>
</head>
<body>
     <div class="container">
        <h1>Formulário de Cadastro</h1>
        
        <form id="meuFormulario">
            <div class="form-group full-width">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
            </div>
            
            <div class="form-group full-width">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco">
            </div>
            
            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" placeholder="xx.xxx-xxx" oninput="mascara_cep()">
            </div>
            
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="xxx.xxx.xxx-xx" oninput="mascara_cpf()">
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" placeholder="(xx) x xxxx-xxxx" oninput="mascara_telefone()">
            </div>
            
            <div class="form-group">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="XX.XXX.XXX/XXXX-XX" oninput="mascara_cnpj()">
            </div>
            
            <div class="form-group">
                <label for="codigo">Código</label>
                <input type="text" id="codigo" name="codigo" placeholder="xx_xx//xxx-xxx.9.xxx"  oninput="mascara_codigo()">
            </div>
            
            <button type="submit">Enviar</button>
        </form>
        
        <div id="mensagem"></div>
    </div>
</body>
</html>
